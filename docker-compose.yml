x-app-hardening: &app-hardening
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0
  # Fase 2 (depois de a fase 1 funcionar):
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  server_api:
    <<: *app-hardening
    image: partido_uniao:${PROJECT_VERSION}
    container_name: app_project_real
    build: .
    command: ["src.project_part.main:app", "--host", "0.0.0.0", "--port", "10000", "--no-proxy-headers"]
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    ports:
      - "127.0.0.1:10000:10000"
    networks:
      - app_network
    depends_on:
      database_project:
        condition: service_healthy
      redis_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/docs', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3

  database_project:
    image: ${POSTGRES_VERSION}
    container_name: database_db
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USER}", "-d", "${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_database:
    image: ${REDIS_VERSION}
    container_name: cache_db
    command: ["redis-server", "--requirepass", "${REDIS_CACHE_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      - REDISCLI_AUTH=${REDIS_CACHE_PASSWORD}
    networks:
      - app_network
    ports: []
    volumes:
      - redis_volume:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



  # nginx_proxy:
  #   image: nginx:${NGINX_VERSION}
  #   container_name: nginx_server
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx_conf:/etc/nginx/conf.d:ro
  #     - ./certs:/etc/ssl/certs:ro
  #   networks:
  #     - app_network
  #   depends_on:
  #     server_api:
  #       condition: service_healthy

  adminer:
    image: adminer:${ADMINER_VERSION}
    container_name: adminer_project
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app_network
    depends_on:
      database_project:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: [] #["dev"]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped


  redis_queue:
    image: ${REDIS_QUEUE}
    container_name: redis_queue_broker
    ports: []
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --requirepass ${REDIS_QUEUE_PASSWORD}
    volumes:
      - redis_queue_data:/data
    restart: unless-stopped
    networks:
      - app_network


  worker:
    <<: *app-hardening
    build: .
    container_name: taskiq_worker_app
    entrypoint: []
    # Usamos aspas normais no comando para evitar que o Docker confunda as flags com variáveis
    command: "taskiq worker project_part.core.tk_broker:broker project_part.tasks.email_tasks --workers 2"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    networks:
      - app_network
    depends_on:
      redis_queue:
        condition: service_started
      database_project:
        condition: service_healthy
    
    restart: unless-stopped

volumes:
  redis_queue_data:
  app_src_volume:
  postgres_volume:
  redis_volume:

networks:
  app_network:
    driver: bridge









